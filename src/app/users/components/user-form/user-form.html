<h2>Usuário</h2>

<form [formGroup]="form">
  <mat-form-field class="full-width">
    <input matInput placeholder="Nome" formControlName="nome" />
    <mat-error *ngIf="form.get('nome')?.touched && form.get('nome')?.hasError('required')">
      Nome é obrigatório
    </mat-error>
  </mat-form-field>

  <mat-form-field class="full-width">
    <input matInput placeholder="Email" formControlName="email" />

    <mat-error *ngIf="form.get('email')?.touched && form.get('email')?.hasError('required')">>
      Email é obrigatório
    </mat-error>

    <mat-error *ngIf="form.get('email')?.hasError('email')">
      Email inválido
    </mat-error>
  </mat-form-field>

  <mat-form-field class="full-width">
    <input matInput placeholder="CPF" formControlName="cpf" />

    <mat-error *ngIf="form.get('cpf')?.touched && form.get('cpf')?.hasError('required')">
      CPF é obrigatório
    </mat-error>
  </mat-form-field>

  <mat-form-field class="full-width">
    <mat-label>Tipo de telefone</mat-label>

    <mat-select formControlName="tipoTelefone">
      <mat-option value="celular">Celular</mat-option>
      <mat-option value="fixo">Fixo</mat-option>
    </mat-select>

    <mat-error *ngIf="form.get('tipoTelefone')?.touched && form.get('tipoTelefone')?.hasError('required')">
      Tipo é obrigatório
    </mat-error>
  </mat-form-field>

  <button mat-raised-button color="primary" (click)="salvar()" [disabled]="form.invalid">
    Salvar
  </button>
</form>
