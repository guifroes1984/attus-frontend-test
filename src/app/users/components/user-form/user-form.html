<h2>{{ data ? 'Editar' : 'Novo' }} Usuário</h2>

<form [formGroup]="form" (ngSubmit)="salvar()">

  <mat-form-field class="full-width" appearance="outline">
    <mat-label>Nome</mat-label>
    <input matInput formControlName="nome" />
    <mat-error *ngIf="form.get('nome')?.hasError('required')">
      Nome é obrigatório
    </mat-error>
  </mat-form-field>

  <mat-form-field class="full-width" appearance="outline">
    <mat-label>Email</mat-label>
    <input matInput type="email" formControlName="email" />
    <mat-error *ngIf="form.get('email')?.hasError('required')">
      Email é obrigatório
    </mat-error>
    <mat-error *ngIf="form.get('email')?.hasError('email')">
      Email inválido
    </mat-error>
  </mat-form-field>

  <mat-form-field class="full-width" appearance="outline">
    <mat-label>CPF</mat-label>
    <input matInput formControlName="cpf" />
    <mat-error *ngIf="form.get('cpf')?.hasError('required')">
      CPF é obrigatório
    </mat-error>
  </mat-form-field>

  <mat-form-field class="full-width" appearance="outline">
    <mat-label>Tipo de telefone</mat-label>
    <mat-select formControlName="tipoTelefone">
      <mat-option value="celular">Celular</mat-option>
      <mat-option value="fixo">Fixo</mat-option>
    </mat-select>
  </mat-form-field>

  <div class="dialog-actions">
    <button mat-button (click)="fechar()">Cancelar</button>
    <button mat-raised-button color="primary" [disabled]="form.invalid">
      Salvar
    </button>
  </div>
</form>
